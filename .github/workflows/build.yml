# ============================================================
#  Sparkle AI Buddy — GitHub Actions CI/CD Pipeline
#  Fires only when PR is merged into main.
#  No writing back to main — version comes from release tag.
# ============================================================

name: Build and Release Firmware

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install arduino-cli
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/arduino-cli version

      - name: Install ESP32 core
        run: |
          $HOME/bin/arduino-cli config init
          $HOME/bin/arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          $HOME/bin/arduino-cli core update-index
          $HOME/bin/arduino-cli core install esp32:esp32@3.0.7

      - name: Install libraries
        run: |
          $HOME/bin/arduino-cli lib install "Adafruit SSD1306"
          $HOME/bin/arduino-cli lib install "Adafruit GFX Library"
          $HOME/bin/arduino-cli lib install "Adafruit NeoPixel"
          $HOME/bin/arduino-cli lib install "ArduinoJson"

      - name: Generate secrets.h
        run: |
          cat > firmware/secrets.h << 'EOF'
          #pragma once
          #define WIFI_SSID    "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS    "${{ secrets.WIFI_PASS }}"
          #define GROQ_KEY     "${{ secrets.GROQ_KEY }}"
          #define VOICERSS_KEY "${{ secrets.VOICERSS_KEY }}"
          EOF

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="1.0.$RUN_NUMBER"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"$VERSION\"/" firmware/firmware.ino

      - name: Compile firmware
        run: |
          $HOME/bin/arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            --output-dir build/ \
            firmware/firmware.ino

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Firmware v${{ env.VERSION }}
          files: build/firmware.ino.bin
          body: Auto-built from commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
